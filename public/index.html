<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UzhavAI</title>
<!-- Pure logic lives in lib/logic.js and is unit-tested in tests/logic.test.js —
     this page only wires that tested logic to the DOM. Run `npm test` to verify. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --soil:#241d14; --soil2:#332818; --paper:#f4ecd8; --turmeric:#e5a33b;
  --leaf:#5c8a4a; --leaf-dk:#436236; --text:#f4ecd8; --muted:#c9bda3;
  --danger:#c8623f;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ } }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--soil);color:var(--text);font-family:'Hind',system-ui,sans-serif;line-height:1.5;}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;}
.wrap{max-width:760px;margin:0 auto;padding:20px 20px 60px;}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:env(safe-area-inset-top,0px);}
.brand{display:flex;align-items:baseline;gap:8px;}
.brand h1{font-size:1.5rem;color:var(--turmeric);}
.brand span{color:var(--muted);font-size:.85rem;}
select{background:var(--soil2);color:var(--text);border:1px solid #4a3d28;border-radius:8px;padding:8px 10px;font-family:inherit;font-size:.9rem;}
.hero{margin-top:28px;}
.hero h2{font-size:1.9rem;font-weight:500;color:var(--paper);max-width:14ch;}
.hero p{color:var(--muted);max-width:52ch;margin-top:8px;}
.ask-card{background:var(--soil2);border-radius:16px;padding:20px;margin-top:20px;border:1px solid #4a3d28;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
textarea{flex:1;min-width:200px;background:#1c1710;color:var(--text);border:1px solid #4a3d28;border-radius:10px;padding:12px;font-family:inherit;font-size:1rem;resize:vertical;min-height:52px;}
button{font-family:inherit;font-size:.95rem;border:none;border-radius:10px;padding:12px 16px;cursor:pointer;}
.btn-mic{background:var(--leaf);color:#fff;width:52px;height:52px;border-radius:50%;font-size:1.3rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-mic.on{background:var(--danger);}
.btn-primary{background:var(--turmeric);color:#241d14;font-weight:600;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid #4a3d28;}
.photo-row{margin-top:10px;font-size:.85rem;color:var(--muted);}
.photo-row input{color:var(--muted);}
#thumb{max-height:70px;border-radius:8px;margin-top:8px;display:none;}
.answer{margin-top:16px;padding:16px;border-radius:12px;background:#1c1710;border-left:4px solid var(--leaf);display:none;}
.answer.low{border-left-color:var(--danger);}
.answer.caution{border-left-color:var(--turmeric);}
.answer p{margin:0 0 8px;}
.handoff{font-size:.9rem;color:var(--turmeric);margin-top:6px;white-space:pre-line;}
.tabs{display:flex;gap:8px;margin-top:32px;border-bottom:1px solid #4a3d28;}
.tab{padding:10px 4px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;background:none;border-radius:0;}
.tab.active{color:var(--turmeric);border-bottom-color:var(--turmeric);}
.panel{display:none;padding-top:18px;}
.panel.active{display:block;}
table{width:100%;border-collapse:collapse;font-size:.95rem;}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #3a3020;}
th{color:var(--muted);font-weight:500;font-size:.8rem;}
.scheme{background:var(--soil2);border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #4a3d28;}
.scheme h3{font-size:1.05rem;color:var(--paper);margin-bottom:6px;}
.scheme p{color:var(--muted);font-size:.92rem;margin:0 0 10px;}
.scheme .row{gap:8px;}
.scheme input{flex:1;min-width:140px;background:#1c1710;color:var(--text);border:1px solid #4a3d28;border-radius:8px;padding:9px 10px;font-family:inherit;}
.scheme .a{margin-top:8px;font-size:.9rem;color:var(--paper);display:none;}
.note{color:var(--muted);font-size:.85rem;margin:0 0 12px;}
.disclaimer{background:#2b2214;border:1px solid #6b5326;border-radius:10px;padding:10px 12px;color:var(--turmeric);font-size:.88rem;margin:0 0 16px;}
.btn-sm{padding:6px 10px;font-size:.8rem;}
button:disabled{opacity:.55;cursor:not-allowed;}
.scheme .a .handoff{margin-top:6px;}
footer{margin-top:40px;padding-top:16px;border-top:1px solid #3a3020;color:var(--muted);font-size:.8rem;}
.status{font-size:.85rem;color:var(--muted);margin-top:8px;min-height:1.2em;}
::-webkit-scrollbar{width:8px;height:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>UzhavAI</h1><span id="tagline">Ask in your language</span></div>
    <select id="lang">
      <option value="en">English</option>
      <option value="ta">தமிழ்</option>
    </select>
  </header>

  <div class="hero">
    <h2 id="heroTitle">Ask about your crop, prices, or a scheme</h2>
    <p id="heroSub">Speak, type, or send a photo of your crop. Answers come back in your language.</p>
  </div>

  <div class="ask-card">
    <div class="row">
      <button class="btn-mic" id="micBtn" title="Speak">🎙️</button>
      <textarea id="query" placeholder="e.g. My tomato leaves have brown spots. What should I do?"></textarea>
    </div>
    <div class="photo-row">
      <label><span id="photoLabel">📷 Add a crop photo (optional):</span> <input type="file" id="photo" accept="image/*"></label>
      <div><img id="thumb" alt="Selected crop photo"> <button class="btn-ghost btn-sm" id="removePhoto" style="display:none;"></button></div>
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="btn-primary" id="askBtn">Ask UzhavAI</button>
      <button class="btn-ghost" id="speakBtn" style="display:none;">🔊 Speak answer</button>
    </div>
    <div class="status" id="status"></div>
    <div class="answer" id="answerBox">
      <p id="answerText"></p>
      <div class="handoff" id="handoff" role="alert" style="display:none;"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="prices" id="tabPrices">Mandi Price Snapshot</button>
    <button class="tab" data-tab="schemes" id="tabSchemes">Government schemes</button>
  </div>

  <div class="panel active" id="prices">
    <h3 id="snapshotTitle" style="font-size:1.1rem;margin-bottom:6px;">Mandi Price Snapshot</h3>
    <p class="note" id="snapshotNote"></p>
    <p class="note" id="mandiSource" style="font-size:.8rem;margin-top:-8px;"></p>
    <table>
      <thead><tr><th id="colCrop"></th><th id="colMarket"></th><th id="colPrice"></th><th id="colDate" style="font-size:.75rem;"></th></tr></thead>
      <tbody id="priceRows"></tbody>
    </table>
  </div>

  <div class="panel" id="schemes">
    <div class="disclaimer" id="schemeDisclaimer" role="note"></div>
    <div id="schemeList"></div>
  </div>

  <footer id="footerText"></footer>
</div>

<script src="lib/logic.js"></script>

      const r = await askServer({ prompt:q, lang, mode:"scheme", context:SCHEMES[lang][i].ctx });
      box.textContent = r.answer;
      const h = document.createElement("div"); h.className = "handoff";
      if (r.needsExpert) { h.textContent = handoffText(r); box.appendChild(h); }
    }catch(e){ box.textContent = errorMessage(STR, lang, e && e.code); }
    finally{ btn.disabled = false; }
  }));
}

// --- Backend call: the ONLY place the page talks to an AI. The API key lives
// on the server only; the browser just posts to /api/ask.
async function askServer({ prompt, imageDataUrl, lang, context, mode }){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  let resp;
  try{
    resp = await fetch("/api/ask", {
      method:"POST", headers:{ "Content-Type":"application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ prompt, imageBase64: imageDataUrl || undefined, lang, context, mode }),
    });
  }catch(e){ const err = new Error("network"); err.code = "network_error"; throw err; }
  finally{ clearTimeout(timer); }
  let data = null;
  try{ data = await resp.json(); }catch(e){ /* non-JSON error page */ }
  if(!resp.ok || !data || typeof data.answer !== "string"){
    const err = new Error("ask failed"); err.code = (data && data.error) || "server_error"; throw err;
  }
  return data;
}

// Which safety message applies, by risk category (the server decides WHETHER
// one is needed; this only picks the wording):
//   chemicals / doses / money      -> expert verification before acting
//   unreadable / unverifiable      -> general information only
//   crop problem without a photo   -> "possible causes", no confident diagnosis
//   anything else uncertain        -> general information only
function handoffText(r){
  const s = STR[lang];
  if (r.highStakes) return s.handoffStakes;
  if (r.reason === "unverified") return s.handoffUnverified;
  if (r.reason === "needs_more_info" || r.diagnosis) return s.handoffDiagnosis + (r.usedImage ? "" : "\n" + s.diagnosisTip);
  return s.handoffLow;
}
function showHandoff(el, r){
  el.textContent = r && r.needsExpert ? handoffText(r) : "";
  el.style.display = r && r.needsExpert ? "block" : "none";
}

// --- Photo: downscale in the browser to a JPEG (phone photos are often >5 MB,
// the API's per-image limit) before sending it to the backend.
let photoData = null;
function fileToJpegDataUrl(file, maxDim = 1280){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}
function clearPhoto(){ photoData = null; $("photo").value = ""; $("thumb").style.display = "none"; $("removePhoto").style.display = "none"; }
$("photo").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    photoData = await fileToJpegDataUrl(f);
    $("thumb").src = photoData; $("thumb").style.display = "block"; $("removePhoto").style.display = "inline-block";
    $("status").textContent = "";
  }catch(err){ clearPhoto(); $("status").textContent = STR[lang].errImage; }
});
$("removePhoto").addEventListener("click", clearPhoto);

// --- Voice input (browser Web Speech API)
let recog = null, listening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  recog = new SR();
  recog.interimResults = false;
  recog.onresult = e => { $("query").value = e.results[0][0].transcript; };
  recog.onerror = e => {
    const code = e && e.error;
    if (code === "not-allowed" || code === "service-not-allowed") $("status").textContent = STR[lang].micDenied;
    else if (code === "no-speech" || code === "audio-capture") $("status").textContent = STR[lang].micNoSpeech;
    else if (code !== "aborted") $("status").textContent = STR[lang].noVoice;
  };
  recog.onend = () => { listening=false; $("micBtn").classList.remove("on"); };
}
$("micBtn").addEventListener("click", () => {
  if(!recog){ $("status").textContent = STR[lang].noVoice; return; }
  recog.lang = lang==='ta' ? 'ta-IN' : 'en-IN';
  if(listening){ recog.stop(); return; }
  $("status").textContent = "";
  try{ listening = true; $("micBtn").classList.add("on"); recog.start(); }
  catch(e){ listening = false; $("micBtn").classList.remove("on"); }
});

    const r = await askServer({
      prompt: q, imageDataUrl: photoData, lang, mode: "general",
      context: buildContext(currentPrices, SCHEMES.en),
    });
    lastAnswer = r.answer; lastResult = r;
    $("answerText").textContent = r.answer;
    $("answerBox").classList.toggle("low", !!(r.needsExpert && (r.highStakes || r.reason === "unverified")));
    $("answerBox").classList.toggle("caution", !!(r.needsExpert && !(r.highStakes || r.reason === "unverified")));
    showHandoff($("handoff"), r);
    $("answerBox").style.display = "block";
    $("speakBtn").style.display = "inline-block";
    $("status").textContent = "";
  }catch(e){
    $("status").textContent = errorMessage(STR, lang, e && e.code);
  }finally{
    $("askBtn").disabled = false;
  }
});

// --- Voice output (browser speechSynthesis)
$("speakBtn").addEventListener("click", () => {
  if (!lastAnswer || !window.speechSynthesis) {
    $("status").textContent = STR[lang].noVoice;
    return;
  }

  const voices = speechSynthesis.getVoices();

  // Tamil: explicitly select a Tamil voice
  if (lang === "ta") {
    const tamilVoice = voices.find(
      v => v.lang && v.lang.toLowerCase().startsWith("ta")
    );

    if (!tamilVoice) {
      $("status").textContent = STR[lang].noTamilVoice;
      return;
    }

    const u = new SpeechSynthesisUtterance(lastAnswer);
    u.lang = tamilVoice.lang;
    u.voice = tamilVoice;

    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return;
  }

  // English: keep existing working behavior
  const u = new SpeechSynthesisUtterance(lastAnswer);
  u.lang = "en-IN";

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
});

// Tabs
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); $(t.dataset.tab).classList.add("active");
}));

async function loadMandiPrices() {
  try {
    const res = await fetch("/api/mandi");
    if (!res.ok) return;
    const data = await res.json();
    if (data && Array.isArray(data.prices) && data.prices.length > 0) {
      currentPrices = data.prices;
      mandiMetadata = { source: data.source, fetchedAt: data.fetchedAt };
      applyLang();
    }
  } catch (e) {
    // keep static fallback
  }
}

applyLang();
loadMandiPrices();
</script>
